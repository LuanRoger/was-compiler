[workspace]
members = ["crates/compiler", "crates/cli", "crates/browser"]
default-members = ["crates/compiler", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
was-compiler = { path = "crates/compiler" }
thiserror = "2.0.21"
wasm-encoder = "0.261.0"
wasmprinter = "0.261.0"
wasmparser = { version = "0.261.0", default-features = false, features = ["std", "validate", "features"] }
